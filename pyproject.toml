[project]
name = "goty-knowledge-graph"
version = "1.15.3"
description = "年度最佳游戏知识图谱 · 数据探索 API（FastAPI）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
# 数据挖掘流水线 analysis/ 的额外依赖（matplotlib 仅绘图用，API 不需要）
analysis = [
    "matplotlib>=3.8",
    "infomap>=2.0",
]
# 可选图后端：选 neo4j 时再装（默认网络内存 networkx，无需此依赖）
neo4j = [
    "neo4j>=5.0",
]
# 社区发现扩展：Infomap（信息流）所需的第三方包。
# 注：Louvain 已改用 **networkx 内置**实现（nx.community.louvain_*），不再需要
# python-louvain —— 这样图浏览器与探索板块共用同一套底层，结果不会因实现不同打架。
# 需要 Infomap 时装：uv pip install ".[community]"
community = [
    "infomap>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "locust>=2.0",
]

[tool.uv]
# 本项目以「应用目录」形式运行（uvicorn api.app:app），无需打包成 wheel。
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api", "tests"]
exclude = ["__pycache__", ".venv", "site", "analysis/ml", "vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # 行宽由 formatter 管理，lint 不强制
    "B008",   # FastAPI 依赖注入惯用 Depends() 在默认值，属误报
    "SIM108", # 三元表达式有时降低可读性
    "RUF001", # 中文文案中全角符号是正常书写，非歧义
    "RUF002", # 同上（docstring）
    "RUF003", # 同上（注释）
    "RUF012", # 注册表/工具用类级声明属性（params=[] 等），非运行时可变默认
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# 显式固定 async fixture 的事件循环作用域：pytest-asyncio 1.x 起该值不再隐式继承，
# 不设置会因默认值变更而出现「fixture 与测试用了不同事件循环」的隐晦错误
# （典型症状就是 teardown 阶段抛 RuntimeError('Event loop is closed')）。
asyncio_default_fixture_loop_scope = "function"
# 集成测试默认不运行（需 -m integration 显式触发），避免无外部依赖环境下的不确定性。
addopts = "-m 'not integration'"
markers = [
    "perf: 性能/负载测试（默认不运行，需 -m perf 显式触发）",
    "integration: 集成测试（真实 SMTP / 外部服务，默认不运行，需 -m integration 显式触发）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
