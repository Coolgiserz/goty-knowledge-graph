name: Deploy static site to Pages

# 只发布 **v1 静态首页**（site/index.html）：它数据内联、零外链、vis-network 已本地化，
# 是纯静态自包含页面，可在 GitHub Pages 上独立运行。
#
# **不发布**探索 SPA（site/explorer-graph/）：它依赖 FastAPI 后端（app.js 里
# const API = "/api"），Pages 只服务静态文件，放上去会是打不开的死页面。
# 首页的「开始数据探索」入口默认隐藏，只在探测到 /api/meta 返回 exploration_enabled
# 时才显示，因此在 Pages 上不会出现死链。
#
# 触发方式：
#   · push 到 main 时自动发布（本工作流**独立于** lint-test，不等待其通过，
#     因为发布内容只有首页，与后端测试是否通过无关）
#   · 也可在 Actions 里手动触发（workflow_dispatch）
#
# ⚠️ 仓库侧必须先开启一次：Settings → Pages → Source 选 **GitHub Actions**。
# 若停留在「Deploy from a branch」，GitHub 会用 Jekyll 渲染 README.md 当首页，
# 本工作流即便跑成功也不会生效。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同分支并发时取消旧任务，避免互相覆盖发布产物
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 首页样式是 Tailwind 构建产物（site/src/index.css → site/assets/index.css）。
      # 产物已随仓库提交，这里重新构建一次以保证与源同步；若不同步则让流程失败，
      # 避免发布出样式过期的页面。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Fail if built CSS is out of sync with committed artifact
        run: |
          if ! git diff --quiet site/assets/; then
            echo "::error::site/assets/ 与 site/src/ 不同步。请执行 npm run build:css 并提交产物后再发布。"
            git --no-pager diff --stat site/assets/
            exit 1
          fi

      # 只拷贝首页运行所需的三个文件，不要带上 explorer-graph/（Pages 上跑不起来）。
      # 注意目录布局：首页用**相对路径**引用 assets/index.css 与
      # assets/vis-network.min.js，因此资源必须放在 _site/assets/ 下，
      # 平铺到 _site/ 会导致子路径部署（user.github.io/<repo>/）时 404。
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/
          cp site/assets/index.css _site/assets/
          cp site/assets/vis-network.min.js _site/assets/
          # SEO/GEO：爬虫与 AI 助手的发现入口，与首页一起发布（缺一不可）
          cp site/robots.txt _site/
          cp site/sitemap.xml _site/
          cp site/llms.txt _site/
          # 搜索引擎所有权验证文件（HTML 文件验证方式）。文件名由控制台生成后放进 site/。
          # Google 有两种命名，通配符 `google*.html` 同时覆盖：
          #   · google-site-verification-xxxx.html（旧式）
          #   · googleaec9b9172776c3ae.html（新式，google + 16 位十六进制，本项目用的这种）
          # ⚠️ 必须用条件判断包裹：文件不存在时 cp 的通配符不匹配会报错并中断整个部署，
          #    导致线上站点无法更新。包一层 ls 判断即可「有就带上、没有就跳过」。
          if ls site/google*.html >/dev/null 2>&1; then
            cp site/google*.html _site/
          fi
          if ls site/BingSiteAuth.xml >/dev/null 2>&1; then
            cp site/BingSiteAuth.xml _site/
          fi
          # 禁用 Jekyll：否则 Pages 会忽略下划线开头的文件/目录，且多一次无谓构建
          touch _site/.nojekyll
          echo "产物清单："
          find _site -type f | sort
          du -sh _site

      # 官方推荐：为 Pages 写入 base_path 等配置（子路径站点必需）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 把部署产物的 URL 暴露出去，notify job 要把它写进邮件正文
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 部署结果邮件通知（成功 / 失败都发；失败邮件通常更有价值）
  #
  # 用 dawidd6/action-send-mail（v18）。**pin 到 commit SHA 而不是 tag**：tag 理论上可被
  # 移动，SHA 不可变；这个 action 会拿到邮箱密码，值得多一层保险。
  #
  # **未配置 secrets 时自动跳过**，绝不让 CI 变红——fork 本仓库的人没有 secrets 也能正常跑。
  #
  # ⚠️ 安全红线（详见 docs/DEPLOY_EMAIL_NOTIFICATION.md 第 4 节）：
  #   · 绝不要开 nodemailerdebug / nodemailerlog —— 它把 SMTP 对话（含 AUTH 凭据的
  #     base64）打进 Actions 日志，而**公开仓库的 Actions 日志人人可见**，等于公开邮箱密码。
  #   · 密码只走 secrets，绝不写进 workflow 文件。
  #   · 不要用 connection_url 的 smtp+starttls:// 形式（上游 v18 的 bug：它会强制
  #     secure=true，在 587 端口必然连不上）。改用 server_address + server_port。
  # ---------------------------------------------------------------------------
  notify:
    name: Email notification
    needs: [build, deploy]
    # always()：build/deploy 失败时也要发信；!cancelled()：被并发取消的运行是噪音，不发
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否已配置邮件
        id: cfg
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_TO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 MAIL_SERVER / MAIL_TO，跳过邮件通知。部署结果不受影响。"
          fi

      # 主题与正文都写进文件再让 action 用 file:// 读取：多行文本塞进 YAML 很容易被
      # 转义/缩进搞坏，走文件是唯一稳的路子。
      - name: 组装邮件内容
        if: steps.cfg.outputs.enabled == 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          # 提交信息是**用户可控输入**，走 env 传进 shell，绝不内联进脚本
          # （内联是 GitHub Actions 经典的脚本注入点）。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PROD_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="成功"; ICON="✅"
          else
            STATUS="失败"; ICON="❌"
          fi

          # 全部用参数展开，不启子进程，也不碰管道：
          #   · ${VAR%%$'\n'*} 取第一行——不用 `printf ... | head -1`。head 读完第一行就关
          #     管道，上游 printf 继续写会收到 SIGPIPE；在 `set -o pipefail` 下该错误被传播，
          #     set -e 随即终止脚本。
          #     ⚠️ 实测边界（本机 bash）：提交信息小于 pipe buffer（Linux 64KB）时**不触发**，
          #     约 439KB 才稳定复现「printf: write error: Broken pipe」。
          #     属于「平时好好的、哪天有人粘贴了长 PR 描述才突然炸」那类问题，不如一开始就避开。
          #   · ${VAR:0:80} 截断，同理替代 cut。
          SHA7=${GITHUB_SHA:0:7}
          MSG=${COMMIT_MSG%%$'\n'*}
          MSG=${MSG:0:80}
          if [ -z "$MSG" ]; then
            MSG="（手动触发，无提交信息）"
          fi
          TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          printf '%s GOTY 知识图谱 · 部署%s · %s@%s\n' \
            "$ICON" "$STATUS" "$GITHUB_REF_NAME" "$SHA7" > subject.txt

          {
            printf 'GitHub Pages 部署%s\n\n' "$STATUS"
            printf '仓库     %s\n' "$GITHUB_REPOSITORY"
            printf '分支     %s\n' "$GITHUB_REF_NAME"
            printf '提交     %s\n' "$SHA7"
            printf '提交说明 %s\n' "$MSG"
            printf '触发者   %s\n' "$GITHUB_ACTOR"
            printf '触发方式 %s\n' "$GITHUB_EVENT_NAME"
            printf '时间     %s\n' "$TIME"
            printf '\n'
            if [ "$DEPLOY_RESULT" = "success" ]; then
              printf '线上地址 %s\n' "${PROD_URL:-（未配置 vars.PRODUCTION_URL）}"
              printf 'Pages    %s\n' "$PAGE_URL"
            else
              printf '失败环节 build=%s  deploy=%s\n' "$BUILD_RESULT" "$DEPLOY_RESULT"
            fi
            printf '运行详情 %s\n' "$RUN_URL"
            printf '\n—— 本邮件由 GitHub Actions 自动发送\n'
          } > body.txt

          echo "----- subject -----"; cat subject.txt
          echo "----- body -----"; cat body.txt

      - name: 发送邮件
        if: steps.cfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          # 端口决定加密方式，action 内部按 465 自动推断 secure（465→隐式 TLS，
          # 587→明文连接后 opportunistic STARTTLS），因此**不需要**单独配 secure。
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          # 必须是「纯邮箱」或「显示名 <邮箱>」两种格式之一，否则 action 直接报错
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          # file:// 让 action 从文件读取，避免 YAML 转义问题；中文由 nodemailer 正确编码
          subject: file://subject.txt
          body: file://body.txt
          # 自签证书的企业 SMTP 才需要开；会把 TLS 校验降级，默认不开
          ignore_cert: ${{ vars.MAIL_IGNORE_CERT || 'false' }}
          # 部署结果邮件值得高优先级，便于邮箱客户端置顶
          priority: high
