server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 知识图谱数据/资源
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础 gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
