<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOTY 知识图谱 · 数据探索</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <h1>年度最佳游戏 · 知识图谱</h1>
        <p class="sub">交互式数据探索 · 参数口径可调节 · 数据与解读双重校验</p>
      </div>
    </div>
    <a class="ghost-link" href="/" title="返回原始数据页与洞察">返回数据页 ←</a>
    <div id="data-status" class="data-status loading">数据状态：加载中…</div>
  </header>

  <div class="layout">
    <nav id="board-nav" class="sidebar" aria-label="探索板块"></nav>

    <aside class="side-aux" aria-label="令牌与任务">
      <details class="token-box" open>
        <summary>访问口令（可选）</summary>
        <input id="explore-token" type="password" autocomplete="off"
               placeholder="服务端开启探索模式后，在此粘贴访问口令" />
        <p class="hint">本地通常留空即可；云端需口令才能提交分析任务。</p>
      </details>

      <section class="tasks-panel" aria-label="后台任务管理">
        <div class="tasks-head">
          <h3>后台任务</h3>
          <button id="refresh-jobs" class="mini-btn" type="button">刷新</button>
        </div>
        <p id="queue-summary" class="queue-summary"></p>
        <div id="tasks-list" class="tasks-list">
          <p class="hint">提交计算后，任务在此显示状态与结果。</p>
        </div>
      </section>
    </aside>

    <main class="main">
      <section id="board-header" class="board-header"></section>

      <section id="default-analysis" class="analysis-block">
        <div class="block-head">
          <h3>默认分析</h3>
          <span class="block-note">标准口径下的分析结果（无需操作即可查看）</span>
        </div>
        <div id="default-result" class="result" aria-live="polite"></div>
      </section>

      <div class="explore-bar">
        <button id="toggle-explore" class="toggle-btn" type="button">自定义探索 ▸</button>
        <span class="explore-hint">调整参数自行探索，结果单独展示，不覆盖上方默认分析</span>
      </div>

      <section id="explore-panel" class="explore-panel" hidden>
        <div id="params" class="params-panel" aria-label="参数面板"></div>
        <div id="explore-result" class="result" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
