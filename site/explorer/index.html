<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOTY 知识图谱 · 数据探索</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <h1>年度最佳游戏 · 知识图谱</h1>
        <p class="sub">交互式数据探索 · 算法 / 统计口径可调 · 数据与解读双有效性判定</p>
      </div>
    </div>
    <a class="ghost-link" href="/graph/" title="查看原图谱浏览页">原图谱浏览 →</a>
    <div id="data-status" class="data-status loading">数据状态：加载中…</div>
  </header>

  <div class="layout">
    <nav id="board-nav" class="sidebar" aria-label="探索板块"></nav>

    <aside class="side-aux" aria-label="令牌与任务">
      <details class="token-box" open>
        <summary>访问令牌（可选）</summary>
        <input id="explore-token" type="password" autocomplete="off"
               placeholder="服务端若设了 GOTY_EXPLORE_TOKEN，在此粘贴" />
        <p class="hint">本地无令牌时留空即可；云端带令牌才能提交任务。</p>
      </details>

      <section class="tasks-panel" aria-label="后台任务管理">
        <div class="tasks-head">
          <h3>后台任务</h3>
          <button id="refresh-jobs" class="mini-btn" type="button">刷新</button>
        </div>
        <div id="tasks-list" class="tasks-list">
          <p class="hint">提交计算后，任务在此显示状态与结果。</p>
        </div>
      </section>
    </aside>

    <main class="main">
      <section id="board-header" class="board-header"></section>

      <section id="params" class="params-panel" aria-label="参数面板"></section>

      <div id="result" class="result" aria-live="polite"></div>
    </main>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
